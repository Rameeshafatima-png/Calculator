<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <main class="app">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div>
          <p class="eyebrow">TOOLS</p>
          <h1>Calculator</h1>
        </div>
        <span class="status"><span class="status-dot"></span> Ready</span>
      </header>

      <div class="screen" aria-live="polite">
        <div id="expression" class="expression"></div>
        <div id="display" class="display">0</div>
        <div id="message" class="message" role="status"></div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key function" data-action="clear">AC</button>
        <button class="key function" data-action="delete" aria-label="Delete">⌫</button>
        <button class="key function" data-value="(">(</button>
        <button class="key operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key operator" data-value="+">+</button>

        <button class="key function" data-action="sign">+/−</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="calculate">=</button>
      </div>

      <footer class="footer">
        <span>History</span>
        <button id="clear-history" class="text-button" type="button">Clear</button>
      </footer>
      <ol id="history" class="history" aria-label="Calculation history"></ol>
      <p class="hint">Keyboard supported · Enter to calculate · Esc to clear</p>
    </section>
  </main>
</body>
</html>
